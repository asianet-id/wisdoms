<!doctype html>
<!--
  Halaman link tetap WISDOMS (https://asianet-id.github.io/wisdoms/), diunggah oleh
  scripts/publish-ip.mjs. Membaca ip.json di sebelahnya (alamat server terbaru di VPN
  GlobalProtect) lalu langsung membuka WISDOMS di alamat itu. Halaman ini publik: jangan
  menaruh apa pun di sini selain pengalih ini.
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WISDOMS</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470; --accent: #0b63ce; --line: #dde1e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --text: #e8ebef; --muted: #9aa4b0; --accent: #5aa2ff; --line: #2b323a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: .5px; }
  p { margin: 0 0 10px; }
  #detail, .note { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); font-weight: 600; }
  .note { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>WISDOMS</h1>
  <p id="status">Mencari alamat server…</p>
  <p id="detail"></p>
  <p><a id="go" hidden>Tidak terbuka otomatis? Klik di sini</a></p>
  <p class="note">WISDOMS hanya bisa dibuka saat VPN GlobalProtect tersambung.</p>
</main>
<script>
  (async () => {
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const go = document.getElementById('go');
    try {
      // Penanda waktu melewati cache GitHub Pages (±10 menit), supaya alamat yang baru berubah langsung terbaca.
      const res = await fetch('ip.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const info = await res.json();
      const target = new URL(info.url);
      const when = info.updated
        ? new Date(info.updated).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', dateStyle: 'medium', timeStyle: 'short' }) + ' WIB'
        : '';
      status.textContent = 'Membuka WISDOMS…';
      detail.textContent = 'Alamat server: ' + target.host + (when ? ' · berubah ' + when : '');
      go.href = target.href;
      go.hidden = false;
      location.replace(target.href);
    } catch (err) {
      status.textContent = 'Alamat server belum bisa dibaca. Muat ulang halaman ini sebentar lagi.';
      detail.textContent = String(err.message || err);
    }
  })();
</script>
</body>
</html>
